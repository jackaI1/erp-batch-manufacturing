# Disposable fleet extension of openMAINT. Run on Linux, not on Jack's Mac.
name: fleet-maintenance
services:
  db:
    image: postgis/postgis:17-3.5-alpine@sha256:894f570c0cf0664ed5576a8fd5d5bfb8fb1b19d592885b686c3a88c8bd90c41f
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MAINT_DB_PASSWORD:?Set MAINT_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF-8
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes: [fleet-db:/var/lib/postgresql/data]
  app:
    image: itmicus/cmdbuild:om-2.4.2-4.2.0@sha256:b6fbc9a072d3c5a70cd1eff65545c326a3cecd1b4364cdfb5f6db3106576ea92
    depends_on:
      db: {condition: service_healthy}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MAINT_DB_PASSWORD:?Set MAINT_DB_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_DB: openmaint
      OPENMAINT_DB_USER: openmaint
      OPENMAINT_DB_PASSWORD: ${MAINT_DB_PASSWORD:?Set MAINT_DB_PASSWORD}
      CMDBUILD_DUMP: demo.dump.xz
      JAVA_OPTS: -Xms512m -Xmx3g
    ports: ['127.0.0.1:8090:8080']
volumes:
  fleet-db:
